services:
  omps-backend:
    build:
      context: .
      dockerfile: Dockerfile.omps
    image: af-omps:latest
    container_name: af-omps-backend
    restart: unless-stopped
    command:
      - uvicorn
      - omps_bridge:app
      - --host=0.0.0.0
      - --port=8602
      - --workers=1
    env_file:
      - .env.bridge
    environment:
      OMPS_DATA_ROOT: /app
      OMPS_SERVER_MODE: "true"
      OMPS_SERVER_SECRET_FILE: /run/omps-secrets/omps.env
    ports:
      - "127.0.0.1:8602:8602"
    volumes:
      - ./live_data/dataset.xlsx:/app/dataset.xlsx:ro
      - ./live_data/reference-59:/app/reference-59
      - ./live_data/store:/app/store
      - ./server_secrets:/run/omps-secrets
