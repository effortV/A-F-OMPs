[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nf-atlas-agent"
version = "0.2.0"
description = "Persistent nanofiltration literature discovery, knowledge graph and hybrid RAG agent"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "streamlit>=1.40,<2",
  "httpx>=0.27,<1",
  "beautifulsoup4>=4.12,<5",
  "openai>=1.60,<3",
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.6,<3",
  "sqlalchemy>=2.0,<3",
  "psycopg[binary]>=3.2,<4",
  "python-multipart>=0.0.12,<1",
  "redis>=5,<7",
  "rq>=2,<3",
  "langgraph>=0.2,<2",
  "neo4j>=5.25,<7",
  "chromadb>=0.5.23,<1",
  "sentence-transformers>=3.3,<6",
  "minio>=7.2,<8",
  "PyMuPDF>=1.24,<2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24,<2",
  "ruff>=0.8,<1",
]

[project.scripts]
nf-atlas = "app.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
