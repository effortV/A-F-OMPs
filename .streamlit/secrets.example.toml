# Copy these keys into Streamlit Community Cloud:
# App settings -> Secrets.  Do not commit the real values.

# Public HTTPS URL of the OMPs FastAPI backend, without the trailing /api.
NF_BACKEND_URL = "https://your-omps-backend.example.com"

# Optional backend protection.  Leave blank when the endpoint is protected by
# Cloudflare Access service headers instead.
NF_API_ACCESS_TOKEN = ""
CF_ACCESS_CLIENT_ID = ""
CF_ACCESS_CLIENT_SECRET = ""

STREAMLIT_CLOUD_MODE = "true"
STREAMLIT_REMOTE_BACKEND = "true"
